name: Build Custom ESXi ISO
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Modules
      run: |
        python -m pip install --upgrade pip
        python -m pip install six lxml psutil pyopenssl

    - name: Install PowerCLI and Build ISO
      shell: powershell
      run: |
        Set-ExecutionPolicy Bypass -Scope Process -Force
        Install-Module -Name VMware.PowerCLI -AllowClobber -Force -SkipPublisherCheck
        Set-PowerCLIConfiguration -PythonPath "C:\hostedtoolcache\windows\Python\3.11.9\x64\python.exe" -Scope User -Confirm:$false
        .\ESXi-Customizer-PS.ps1 -v80 -vft -load sata-xahci,net-tg3
        
    - name: Upload Custom ISO
      uses: actions/upload-artifact@v4
      with:
        name: Custom-ESXi-8-ISO
        path: ./*.iso
